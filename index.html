<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <title>Lemma — Learn the world by looking at it</title>

  <meta name="description"
    content="Point your camera at anything and learn what it's called in 12 languages. Real-time on-device object recognition, pronunciation, grammar and spaced-repetition review. Works offline.">
  <meta name="theme-color" content="#F4F1E8">
  <meta name="color-scheme" content="light dark">

  <!-- PWA / iOS -->
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Lemma">
  <link rel="apple-touch-icon" href="icon-512.png">
  <link rel="icon" href="icon-512.png" type="image/png">

  <!-- Social -->
  <meta property="og:title" content="Lemma">
  <meta property="og:description" content="Point your camera at anything and learn its name — in 12 languages, with gender, colour and grammar. Entirely on your device.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="icon-512.png">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/components.css">
  <link rel="stylesheet" href="styles/views.css">

  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <script defer src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.17.0/dist/tf.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"></script>
</head>

<body>
  <a class="visually-hidden" href="#view-camera">Skip to camera</a>

  <div id="app">
    <main id="views" class="grow" style="position:relative">

      <!-- ══ Camera ═══════════════════════════════════════════════════ -->
      <section class="view is-active on-camera" id="view-camera" role="tabpanel" aria-labelledby="tab-camera">
        <div id="stage">
          <video id="webcam" autoplay playsinline muted disablepictureinpicture></video>
          <canvas id="overlay" aria-hidden="true"></canvas>
          <div id="label-layer"></div>
          <div id="focus-ring" aria-hidden="true"></div>
          <div id="flash" aria-hidden="true"></div>

          <div id="cam-top">
            <button class="lang-pill" id="btn-lang" aria-label="Change learning language"></button>
            <span class="grow"></span>
            <button class="icon-btn" id="btn-quiz" aria-label="Quiz mode" aria-pressed="false" title="Quiz mode (Q)"></button>
          </div>

          <div id="status-pill" role="status" aria-live="off"></div>

          <div id="cam-side">
            <button class="icon-btn" id="btn-flip" aria-label="Switch camera" title="Flip camera (F)"></button>
            <button class="icon-btn" id="btn-torch" aria-label="Torch" aria-pressed="false" hidden></button>
            <button class="icon-btn" id="btn-zoom" aria-label="Zoom level" title="Zoom"
              style="font-size:13px;font-weight:700">1×</button>
            <button class="icon-btn" id="btn-pause" aria-label="Pause detection" title="Pause (P)"></button>
          </div>

          <div id="cam-bottom">
            <div id="detected-strip" aria-live="polite" aria-label="Objects currently detected"></div>
            <div id="shutter-row">
              <button class="icon-btn icon-btn-lg" id="btn-import" aria-label="Analyse a photo from your library"></button>
              <button class="shutter" id="btn-shutter" aria-label="Capture snapshot"></button>
              <button class="icon-btn icon-btn-lg" id="btn-help" aria-label="Tips"></button>
            </div>
          </div>

          <div id="cam-error" role="alert"></div>
        </div>
        <input type="file" id="photo-input" accept="image/*" hidden>
      </section>

      <!-- ══ Learn ════════════════════════════════════════════════════ -->
      <section class="view" id="view-learn" role="tabpanel" aria-labelledby="tab-learn"></section>

      <!-- ══ Progress ═════════════════════════════════════════════════ -->
      <section class="view" id="view-progress" role="tabpanel" aria-labelledby="tab-progress"></section>

      <!-- ══ Settings ═════════════════════════════════════════════════ -->
      <section class="view" id="view-settings" role="tabpanel" aria-labelledby="tab-settings"></section>
    </main>

    <nav id="tabbar" role="tablist" aria-label="Main navigation"></nav>
  </div>

  <div id="toast-layer"></div>
  <div id="onboarding"></div>

  <!-- ══ Launch screen ══════════════════════════════════════════════ -->
  <div id="launch">
    <div class="launch-mark">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
        stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="8.6" />
        <path d="M7.9 10.3h8.2M7.9 13.7h4.7" />
      </svg>
    </div>
    <div class="launch-word">Lemma</div>
    <div class="launch-tag">Look it up by looking.</div>
    <div class="launch-track"><div class="launch-fill" id="launch-fill"></div></div>
    <div class="launch-status" id="launch-status">Starting…</div>
    <div class="launch-credit">Developed by Rushan Haque</div>
  </div>

  <noscript>
    <div style="padding:2rem;text-align:center;font-family:system-ui">
      <h1>JavaScript required</h1>
      <p>Lemma runs its object recognition in your browser, which needs JavaScript enabled.</p>
    </div>
  </noscript>

  <script type="module" src="src/app.js"></script>
</body>

</html>
